org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# Ads (CL-370): true shows the Home banner, catalogue native rows and the PDF interstitial in that
# flavor; false builds it with no ad SDK, no ad layout and no INTERNET permission. Dev uses Google's
# test ads. Production stays off for the first, offline India release; turning it on needs real AdMob
# IDs (see app/build.gradle.kts). Override per build with -Pchecklist.ads.<flavor>=true|false.
checklist.ads.dev=true
checklist.ads.staging=false
checklist.ads.production=false
