name: Dev APK pre-release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Android build run id
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download apks artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n apks -D apks
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R apks
          gh release create "dev-apk-${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Dev APK ${{ inputs.run_id }}" --notes "Temporary test build" $(find apks -iname '*dev*.apk')
