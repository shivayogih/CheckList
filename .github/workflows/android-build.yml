# Phase 1 build verification (CL-105): builds all three environments and runs unit tests and lint.
# The full PR pipeline (static analysis, AI review, reports) replaces this in Phase 8.
name: Android build

# Every branch push is built, so feature branches get feedback before a PR exists;
# the push run's status also shows on the branch's PR.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies and the wrapper; the key changes when build files or the catalog change.
      - uses: gradle/actions/setup-gradle@v4

      # Seed catalog rules (CL-113): keys, categories, unit codes and all 7 locale files.
      - name: Validate seed catalog
        run: python3 tools/seed/validate_seed.py

      - name: Unit tests
        run: ./gradlew --stacktrace :domain:test :data:testDebugUnitTest :ai:testDebugUnitTest :app:testDevDebugUnitTest

      # The build regenerates Room schemas into data/schemas; any difference means an entity changed
      # without its exported schema (and migration) being committed.
      # `if: always()` so the generated schema is printed even when a test failed first.
      - name: Room schema is committed
        if: always()
        run: |
          git status --porcelain -- data/schemas
          if [ -n "$(git status --porcelain -- data/schemas)" ]; then
            echo "::error::A Room schema differs from the committed one. Commit the file(s) printed below."
            git add -N data/schemas
            git --no-pager diff -- data/schemas
            exit 1
          fi

      - name: Lint
        run: ./gradlew --stacktrace :app:lintDevDebug

      - name: Build dev, staging and production
        run: ./gradlew --stacktrace :app:assembleDevDebug :app:assembleStagingRelease :app:assembleProductionRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      # PNGs recorded by the Roborazzi screenshot tests (item row, form, viewer, PDF page; light, dark, 200% font, Tamil).
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
