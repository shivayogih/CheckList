# Phase 1 build verification (CL-105): builds all three environments and runs unit tests and lint.
# The full PR pipeline (static analysis, AI review, reports) replaces this in Phase 8.
name: Android build

# Every branch push is built, so feature branches get feedback before a PR exists;
# the push run's status also shows on the branch's PR.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies and the wrapper; the key changes when build files or the catalog change.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace :domain:test :data:testDebugUnitTest :app:testDevDebugUnitTest

      # TEMPORARY (CL-112): prints the generated Room schema so it can be committed; removed afterwards.
      - name: Print Room schema
        if: always()
        run: find data/schemas data/build -path '*schemas*' -name '*.json' -print -exec cat {} \; || true

      - name: Lint
        run: ./gradlew --stacktrace :app:lintDevDebug

      - name: Build dev, staging and production
        run: ./gradlew --stacktrace :app:assembleDevDebug :app:assembleStagingRelease :app:assembleProductionRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
