// Compose compiler stability configuration (docs/performance-and-state.md, section "Compose").
//
// :domain is a plain Kotlin/JVM module, so the Compose compiler cannot see that its classes are
// immutable and would treat every UI model that holds a domain type (a ChecklistId, a Quantity, a
// UnitDef...) as unstable. With strong skipping that still compiles, but a row is then recomposed
// whenever its model instance changes, and the ViewModels build new instances on every emission.
//
// Everything in these packages is a data class, enum or value class with only `val` properties of
// immutable types (checked: no `var`, no MutableList/MutableMap/Array in domain/model). Keep it that way:
// a mutable property added to a model must be removed from this list in the same change.
com.dataloom.checklist.domain.model.**
java.io.File
